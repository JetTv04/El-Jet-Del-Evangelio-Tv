<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Jet del Evangelio Web-Tv - En Vivo</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #1e293b;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .logo-container h1 {
      font-size: 1.3rem;
      color: #ffffff;
    }
    .live-badge {
      background-color: #ef4444;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      gap: 1.5rem;
    }

    /* Banner principal en CSS puro */
    .banner-header {
      width: 100%;
      background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: center;
      border: 1px solid #38bdf8;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .banner-header h2 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    .banner-header p {
      color: #e0f2fe;
      font-size: 1rem;
      margin-bottom: 1.2rem;
    }

    /* Banderas mediante emojis nativos */
    .flags-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 0.5rem;
    }
    .flag-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 1.3rem;
      line-height: 1;
      transition: transform 0.2s;
    }
    .flag-item:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.25);
    }

    /* Contenedor del video */
    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Tarjeta de información y botones */
    .info-card {
      width: 100%;
      background-color: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .info-card h3 {
      font-size: 1.1rem;
      color: #38bdf8;
      margin-bottom: 1rem;
    }
    .social-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s, opacity 0.2s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .btn-radio { background-color: #0284c7; }
    .btn-youtube { background-color: #ff0000; }
    .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: #64748b;
      font-size: 0.85rem;
      border-top: 1px solid #334155;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <h1>✈️ El Jet del Evangelio Web-Tv</h1>
    </div>
    <span class="live-badge">EN VIVO</span>
  </header>

  <main>
    <!-- Banner Principal -->
    <div class="banner-header">
      <h2>✈️ El Jet del Evangelio Web-Tv</h2>
      <p>Llevando el mensaje de fe, esperanza y alabanza a todas las naciones</p>
