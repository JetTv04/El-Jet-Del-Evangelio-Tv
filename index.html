  <main>

  <script>
    // Manejo de PWA
    let deferredPrompt;
    const btnInstall = document.getElementById('btnInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'inline-block';
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          btnInstall.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    // Registrar Service Worker de Webpushr
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./webpushr-sw.js').then(function() {
        console.log('Webpushr SW registrado correctamente');
      }).catch(function(err) {
        console.log('Error al registrar SW:', err);
      });
    }

    // Solicitud forzada de permisos
    function requestNotificationPermission() {
      if (!("Notification" in window)) {
        alert("Tu navegador no soporta notificaciones.");
        return;
      }

      if (Notification.permission === "granted") {
        alert("¡Ya tienes las notificaciones activadas!");
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(function (permission) {
          if (permission === "granted") {
            alert("¡Gracias! Notificaciones activadas con éxito.");
            if (typeof webpushr === 'function') {
              webpushr('prompt');
            }
          } else {
            alert("Permiso denegado. Puedes activarlo desde la configuración de tu navegador.");
          }
        });
      } else {
        alert("Las notificaciones están bloqueadas en tu navegador. Haz clic en el icono del candado 🔒 junto a la URL para permitir notificaciones.");
      }
    }
  </script>
