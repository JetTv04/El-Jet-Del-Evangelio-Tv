    :root {

      --header-bg: #1e293b;

      --text-color: #f8fafc;
      --text-muted: #e0f2fe;
      --border-color: #334155;
      --accent-color: #38bdf8;
    }

    body.light-mode {

      --text-muted: #1e293b;
      --border-color: #cbd5e1;
      --accent-color: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    header {
      background-color: var(--header-bg);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.3s;
    }

    .logo-container h1 {
      font-size: 1.3rem;
      color: var(--text-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background-color 0.2s;
    }

    .theme-toggle-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .live-badge {
      background-color: #ef4444;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      gap: 1.5rem;
    }

    .banner-header {
      width: 100%;
      background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: center;
      border: 1px solid #38bdf8;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .banner-header h2 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
