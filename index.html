<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Jet del Evangelio Web-Tv - En Vivo</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Plane_icon_font_awesome.svg/512px-Plane_icon_font_awesome.svg.png">
  <meta name="theme-color" content="#0f172a">

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase SDKs Compatibilidad CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0284c7;
      --text-color: #f8fafc;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      margin-bottom: 1rem;
    }

    .banner-alert {
      display: none;
      background-color: #f59e0b;
      color: #000;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 1rem;
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .player-container {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      position: relative;
    }

    iframe { width: 100%; height: 100%; border: none; }

    .interaction-bar {
      display: flex;
      gap: 12px;
      margin-top: 1rem;
      width: 100%;
      max-width: 900px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-action {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .chat-card {
      margin-top: 1.5rem;
      width: 100%;
      max-width: 900px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .chat-card h3 { margin-bottom: 0.75rem; font-size: 1.1rem; }

    .auth-box {
      text-align: center;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn-google {
      background-color: #ffffff;
      color: #000000;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .chat-form { display: none; flex-direction: column; gap: 10px; }

    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      resize: vertical;
      min-height: 60px;
    }

    .user-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .btn-logout {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      text-decoration: underline;
    }

    .plane-anim {
      position: fixed;
      font-size: 2.5rem;
      pointer-events: none;
      z-index: 9999;
      animation: fly 2s linear forwards;
    }

    @keyframes fly {
      0% { transform: translate(-50px, 100vh) rotate(-20deg); opacity: 1; }
      100% { transform: translate(100vw, -100px) rotate(15deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <header>
    <h1>El Jet del Evangelio Web-Tv</h1>
  </header>

  <div id="bannerAlert" class="banner-alert"></div>

  <div class="player-container">
    <iframe id="tvPlayer" src="https://ok.ru/videoembed/16493078060749?nochat=1&autoplay=1" allowfullscreen></iframe>
  </div>

  <div class="interaction-bar">
    <button id="btnAmen" class="btn-action">🙌 ¡Decir Amén! (<span id="amenCount">0</span>)</button>
    <button id="btnJet" class="btn-action">✈️ Lanzar Jet (<span id="jetCount">0</span>)</button>
  </div>

  <div class="chat-card">
    <h3>💬 Peticiones de Oración y Saludos</h3>

    <!-- Caja de Login -->
    <div id="authBox" class="auth-box">
      <p style="font-size:0.9rem; opacity:0.8;">Inicia sesión para enviar tu mensaje en vivo a la transmisión:</p>
      <button id="btnLoginGoogle" class="btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
        Continuar con Google
      </button>
    </div>

    <!-- Formulario de Envío -->
    <form id="chatForm" class="chat-form">
      <div class="user-info">
        <span id="userName">Usuario</span>
        <button type="button" id="btnLogout" class="btn-logout">Cerrar sesión</button>
      </div>
      <textarea id="msgInput" placeholder="Escribe tu saludo o petición..." required></textarea>
      <button type="submit" class="btn-action" style="background-color: var(--accent-color);">Enviar Mensaje</button>
    </form>
  </div>

  <script>
    // --- CONFIGURACIÓN DE FIREBASE CORREGIDA ---
    const firebaseConfig = {
      apiKey: "AIzaSyBBTT3w-gKAnjnylo3MapQrYURMW3eexXs",
      authDomain: "eljettv-a09f8.firebaseapp.com",
      databaseURL: "https://eljettv-a09f8-default-rtdb.firebaseio.com",
      projectId: "eljettv-a09f8",
      storageBucket: "eljettv-a09f8.firebasestorage.app",
      messagingSenderId: "1064986191642",
      appId: "1:1064986191642:web:0d4b87ac0195b27853eea3",
      measurementId: "G-S6FTGR16K1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // --- AUTENTICACIÓN ---
    const btnLoginGoogle = document.getElementById('btnLoginGoogle');
    const btnLogout = document.getElementById('btnLogout');
    const authBox = document.getElementById('authBox');
    const chatForm = document.getElementById('chatForm');
    const userNameDisplay = document.getElementById('userName');

    btnLoginGoogle.addEventListener('click', () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => {
        alert("Error al iniciar sesión: " + err.message);
      });
    });

    btnLogout.addEventListener('click', () => auth.signOut());

    auth.onAuthStateChanged(user => {
      if (user) {
        authBox.style.display = 'none';
        chatForm.style.display = 'flex';
        userNameDisplay.innerText = "Conectado como: " + user.displayName;
      } else {
        authBox.style.display = 'flex';
        chatForm.style.display = 'none';
      }
    });

    // --- INTERACCIONES Y CONTADORES ---
    const btnAmen = document.getElementById('btnAmen');
    const btnJet = document.getElementById('btnJet');
    const amenCount = document.getElementById('amenCount');
    const jetCount = document.getElementById('jetCount');

    db.ref('contadores').on('value', snapshot => {
      const data = snapshot.val() || { amen: 0, jets: 0 };
      amenCount.innerText = data.amen || 0;
      jetCount.innerText = data.jets || 0;
    });

    btnAmen.addEventListener('click', () => {
      db.ref('contadores/amen').transaction(curr => (curr || 0) + 1);
      confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
    });

    btnJet.addEventListener('click', () => {
      db.ref('contadores/jets').transaction(curr => (curr || 0) + 1);
      animarJet();
    });

    function animarJet() {
      const jet = document.createElement('div');
      jet.classList.add('plane-anim');
      jet.innerText = '✈️';
      jet.style.left = Math.random() * 50 + 'vw';
      document.body.appendChild(jet);
      setTimeout(() => jet.remove(), 2000);
    }

    // --- ENVIAR MENSAJES ---
    chatForm.addEventListener('submit', e => {
      e.preventDefault();
      const user = auth.currentUser;
      const text = document.getElementById('msgInput').value.trim();
      if (!user || !text) return;

      db.ref('mensajes').push({
        usuario: user.displayName,
        foto: user.photoURL,
        mensaje: text,
        timestamp: Date.now()
      }).then(() => {
        document.getElementById('msgInput').value = '';
        alert("¡Mensaje enviado a la transmisión!");
      });
    });

    // --- ESCUCHAR EFECTOS REMOTOS DEL PANEL DE CONTROL ---
    let ultimoEfectoTimestamp = 0;
    db.ref('efectos_remotos').on('value', snapshot => {
      const data = snapshot.val();
      if (data && data.timestamp > ultimoEfectoTimestamp) {
        ultimoEfectoTimestamp = data.timestamp;
        if (data.tipo === 'confetti') confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 } });
        if (data.tipo === 'jets') { for(let i=0; i<5; i++) setTimeout(animarJet, i * 200); }
      }
    });

    // --- ESCUCHAR AVISOS/ALERTAS Y CAMBIO DE VIDEO ---
    db.ref('alerta_activa').on('value', snapshot => {
      const data = snapshot.val();
      const banner = document.getElementById('bannerAlert');
      if (data && data.texto) {
        banner.innerText = "📢 " + data.texto;
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }
    });

    db.ref('transmision_especial').on('value', snapshot => {
      const data = snapshot.val();
      const player = document.getElementById('tvPlayer');
      if (data && data.activo && data.embedUrl) {
        if (player.src !== data.embedUrl) player.src = data.embedUrl;
      } else {
        const defaultUrl = "https://ok.ru/videoembed/16493078060749?nochat=1&autoplay=1";
        if (player.src !== defaultUrl) player.src = defaultUrl;
      }
    });
  </script>
</body>
</html>
