    }

    @keyframes pulse {

      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    main {

      display: flex;

    /* Estilos de la imagen / banner promocional */
    .banner-container {

      border-radius: 12px;

    }
    .banner-container img {
      width: 100%;
      height: auto;
      max-height: 250px;
      object-fit: cover;
      display: block;
    }

    /* Contenedor del video */
    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .info-card {
      width: 100%;
      background-color: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .info-card h2 {
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    .info-card p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .social-section {
      border-top: 1px solid #334155;
      padding-top: 1.2rem;
    }
    .social-section h3 {
      font-size: 1.1rem;
      color: #f8fafc;
      margin-bottom: 1rem;
    }
    .social-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: transform 0.2s, opacity 0.2s;
    }
