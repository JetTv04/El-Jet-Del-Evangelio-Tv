<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título en la pestaña del navegador -->
  <title>El Jet del Evangelio Web-Tv - En Vivo</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .logo-container h1 {
      font-size: 1.5rem;
      color: #ffffff;
    }
    .live-badge {
      background-color: #ef4444;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }
    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .info-card {
      width: 100%;
      background-color: #1e293b;
      margin-top: 1.5rem;
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .info-card h2 {
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    .info-card p {
      color: #94a3b8;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <h1>✈️ El Jet del Evangelio Web-Tv</h1>
    </div>
    <span class="live-badge">EN VIVO</span>
  </header>

  <main>
    <div class="video-wrapper">
      <!-- Reproductor de OK.ru configurado con autoplay -->
      <iframe 
        src="https://ok.ru/videoembed/16503506935501?nochat=1&autoplay=1" 
        allow="autoplay; encrypted-media; fullscreen" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="info-card">
      <h2>Transmisión en directo</h2>
      <p>Bienvenido a El Jet del Evangelio Web-Tv. Disfruta de nuestra programación en vivo, mensajes y alabanzas.</p>
    </div>
  </main>

</body>
</html>
