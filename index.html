<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Jet del Evangelio Web-Tv</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      padding: 20px;
      background-color: #1f1f1f;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }
    /* Tarjeta del Versículo del Día */
    .verse-card {
      background: #1e1e1e;
      color: #fff;
      padding: 18px;
      border-radius: 12px;
      border-left: 4px solid #ffcc00;
      margin-bottom: 20px;
      text-align: left;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .verse-title {
      color: #ffcc00;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 8px;
    }
    .verse-text {
      font-style: italic;
      font-size: 1.05rem;
      margin: 0 0 8px 0;
      line-height: 1.4;
    }
    .verse-ref {
      font-size: 0.9rem;
      color: #bbb;
      font-weight: bold;
      display: block;
      text-align: right;
    }
    /* Reproductor de Video */
    .player-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background-color: #000;
    }
    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>El Jet del Evangelio Web-Tv</h1>
  </header>

  <div class="container">
    
    <!-- Tarjeta Interactiva del Versículo del Día -->
    <div class="verse-card">
      <span class="verse-title">📖 Versículo del Día</span>
      <p class="verse-text" id="verse-text">Cargando la Palabra de hoy...</p>
      <span class="verse-ref" id="verse-ref"></span>
    </div>

    <!-- Reproductor de Video (OK.ru) -->
    <div class="player-container">
      <iframe src="https://ok.ru/videoembed/8982390111933?nochat=1" allowfullscreen></iframe>
    </div>

  </div>

  <script>
    // Registro de PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./webpushr-sw.js').catch(function(err) {
        console.log('SW registro:', err);
      });
    }

    // Obtener Versículo del Día automáticamente (API Bíblica)
    async function cargarVersiculoDelDia() {
      try {
        const respuesta = await fetch('https://beta.ourmanna.com/api/v1/get?format=json&order=daily');
        const datos = await respuesta.json();
        
        document.getElementById('verse-text').innerText = `"${datos.verse.details.text}"`;
        document.getElementById('verse-ref').innerText = `— ${datos.verse.details.reference} (${datos.verse.details.version})`;
      } catch (error) {
        // Versículo de respaldo si no hay conexión a la API
        document.getElementById('verse-text').innerText = '"Todo lo puedo en Cristo que me fortalece."';
        document.getElementById('verse-ref').innerText = '— Filipenses 4:13 (RVR1960)';
      }
    }

    cargarVersiculoDelDia();
  </script>

</body>
</html>
