<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de Control - El Jet del Evangelio Admin</title>
  
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Plane_icon_font_awesome.svg/512px-Plane_icon_font_awesome.svg.png">
  <meta name="theme-color" content="#0f172a">

  <!-- Firebase SDKs via CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #334155;
      --accent-color: #38bdf8;
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 10px;
    }

    .mode-switch {
      display: flex;
      background: var(--bg-color);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .mode-btn.active { background-color: var(--accent-color); color: #0f172a; }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card h2 { font-size: 1.1rem; color: var(--accent-color); }

    .counters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .counter-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .counter-value { font-size: 2rem; font-weight: bold; color: var(--accent-color); }

    .admin-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      color: white;
      font-size: 0.95rem;
    }

    .btn-primary { background-color: #0284c7; }
    .btn-success { background-color: var(--success-color); }
    .btn-danger { background-color: var(--danger-color); }
    .btn-warning { background-color: #f59e0b; color: #000; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
    }

    .message-item {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
    }

    .advanced-only { display: none; }
    body.mode-advanced .advanced-only { display: flex; }
  </style>
</head>
<body class="mode-easy">

  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <span>🎛️</span>
      <h1>Panel de Administración TV</h1>
    </div>

    <div class="mode-switch">
      <button id="btnModeEasy" class="mode-btn active">⚡ Modo Fácil</button>
      <button id="btnModeAdvanced" class="mode-btn">🛠️ Modo Avanzado</button>
    </div>
  </header>

  <main>
    <div class="grid-container">
      
      <!-- Contadores Realtime -->
      <div class="card">
        <h2>📊 Interacción en Vivo</h2>
        <div class="counters-grid">
          <div class="counter-box">
            <div id="countAmen" class="counter-value">0</div>
            <div style="font-size:0.8rem;">🙌 Amén Recibidos</div>
          </div>
          <div class="counter-box">
            <div id="countJets" class="counter-value">0</div>
            <div style="font-size:0.8rem;">✈️ Jets Lanzados</div>
          </div>
        </div>

        <div style="display:flex; gap:10px;">
          <button id="triggerConfetti" class="admin-btn btn-primary">🎉 Tirar Confetti</button>
          <button id="triggerJets" class="admin-btn btn-success">✈️ Lanzar Jets</button>
        </div>
      </div>

      <!-- Bandeja Realtime de Mensajes -->
      <div class="card">
        <h2>💬 Peticiones y Saludos en Vivo</h2>
        <div id="messagesContainer" class="messages-list">
          <p style="font-size:0.85rem; opacity:0.6; text-align:center;">Cargando mensajes...</p>
        </div>

        <div class="advanced-only">
          <button id="btnClearMessages" class="admin-btn btn-danger" style="width: 100%;">
            🧹 Limpiar Historial de Mensajes
          </button>
        </div>
      </div>

    </div>

    <div class="grid-container advanced-only">

      <!-- Gestión de Transmisión Especial -->
      <div class="card">
        <h2>📺 Transmisión Especial (Embed)</h2>
        <div class="form-group">
          <label style="font-size:0.85rem;">URL de incrustación (Iframe/Embed):</label>
          <textarea id="embedInput" placeholder="https://www.youtube.com/embed/..."></textarea>
        </div>
        <div style="display:flex; gap:10px;">
          <button id="btnStartLive" class="admin-btn btn-success">🔴 Activar En Vivo</button>
          <button id="btnStopLive" class="admin-btn btn-danger">⏹️ Restaurar OK.ru</button>
        </div>
      </div>

      <!-- Emisor de Alertas -->
      <div class="card">
        <h2>📢 Enviar Aviso / Marquesina</h2>
        <div class="form-group">
          <input type="text" id="alertInput" placeholder="Ej: ¡Estamos en vivo! Envía tu mensaje.">
        </div>
        <div style="display:flex; gap:10px;">
          <button id="btnSendAlert" class="admin-btn btn-warning">📢 Publicar Aviso</button>
          <button id="btnClearAlert" class="admin-btn btn-danger">❌ Quitar Aviso</button>
        </div>

        <button id="btnResetCounters" class="admin-btn btn-danger" style="margin-top:10px;">
          🔄 Reiniciar Contadores (Amén / Jets)
        </button>
      </div>

    </div>
  </main>

  <script>
    // --- INICIALIZACIÓN DE FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyBBTT3w-gKAnjnylo3MapQrYURMw3eexXs",
      authDomain: "eljettv-a09f8.firebaseapp.com",
      databaseURL: "https://eljettv-a09f8-default-rtdb.firebaseio.com",
      projectId: "eljettv-a09f8",
      storageBucket: "eljettv-a09f8.firebasestorage.app",
      messagingSenderId: "1064986191642",
      appId: "1:1064986191642:web:0d4b87ac0195b27853eea3",
      measurementId: "G-S6FTGR16K1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Modos Fácil / Avanzado
    document.getElementById('btnModeEasy').addEventListener('click', () => {
      document.body.className = 'mode-easy';
      document.getElementById('btnModeEasy').classList.add('active');
      document.getElementById('btnModeAdvanced').classList.remove('active');
    });

    document.getElementById('btnModeAdvanced').addEventListener('click', () => {
      document.body.className = 'mode-advanced';
      document.getElementById('btnModeAdvanced').classList.add('active');
      document.getElementById('btnModeEasy').classList.remove('active');
    });

    // Escuchador de Contadores
    db.ref('contadores').on('value', snapshot => {
      const val = snapshot.val() || {};
      document.getElementById('countAmen').innerText = val.amen || 0;
      document.getElementById('countJets').innerText = val.jets || 0;
    });

    // Escuchador de Mensajes de la Audiencia
    db.ref('mensajes').on('value', snapshot => {
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        container.innerHTML = '<p style="font-size:0.85rem; opacity:0.6; text-align:center;">No hay mensajes registrados.</p>';
        return;
      }

      Object.values(data).reverse().forEach(msg => {
        const item = document.createElement('div');
        item.className = 'message-item';
        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--accent-color); margin-bottom:4px;">
            <strong>${msg.usuario}</strong>
            <span style="opacity:0.7;">${msg.correo || ''}</span>
          </div>
          <div style="font-size:0.9rem;">${msg.mensaje}</div>
        `;
        container.appendChild(item);
      });
    });

    // Gatillos de Efectos
    document.getElementById('triggerConfetti').addEventListener('click', () => {
      db.ref('efectos_remotos').set({ tipo: 'confetti', timestamp: Date.now() });
    });

    document.getElementById('triggerJets').addEventListener('click', () => {
      db.ref('efectos_remotos').set({ tipo: 'jets', timestamp: Date.now() });
    });

    // Limpieza
    document.getElementById('btnClearMessages').addEventListener('click', () => {
      if (confirm('¿Vaciar la bandeja de mensajes?')) db.ref('mensajes').remove();
    });

    document.getElementById('btnResetCounters').addEventListener('click', () => {
      if (confirm('¿Reiniciar contadores a cero?')) db.ref('contadores').set({ amen: 0, jets: 0 });
    });

    // Emisión de Alerta
    document.getElementById('btnSendAlert').addEventListener('click', () => {
      const txt = document.getElementById('alertInput').value.trim();
      if (txt) db.ref('alerta_activa').set({ texto: txt });
    });

    document.getElementById('btnClearAlert').addEventListener('click', () => {
      db.ref('alerta_activa').remove();
      document.getElementById('alertInput').value = '';
    });

    // Transmisión Especial
    document.getElementById('btnStartLive').addEventListener('click', () => {
      const url = document.getElementById('embedInput').value.trim();
      if (url) db.ref('transmision_especial').set({ activo: true, embedUrl: url });
    });

    document.getElementById('btnStopLive').addEventListener('click', () => {
      db.ref('transmision_especial').set({ activo: false, embedUrl: '' });
      document.getElementById('embedInput').value = '';
    });
  </script>
</body>
</html>
