<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de Control - El Jet del Evangelio Admin</title>
  
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Plane_icon_font_awesome.svg/512px-Plane_icon_font_awesome.svg.png">
  <meta name="theme-color" content="#0f172a">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #334155;
      --accent-color: #38bdf8;
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-title { display: flex; align-items: center; gap: 10px; }
    .header-title h1 { font-size: 1.2rem; }

    .mode-switch {
      display: flex;
      background: var(--bg-color);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background-color: var(--accent-color);
      color: #0f172a;
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Contadores Grandes */
    .counters-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .counter-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .counter-value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .counter-label {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 4px;
    }

    /* Botonera de Control */
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .admin-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: white;
      font-size: 0.95rem;
      transition: opacity 0.2s ease;
    }

    .admin-btn:hover { opacity: 0.9; }
    .btn-primary { background-color: #0284c7; }
    .btn-success { background-color: var(--success-color); }
    .btn-danger { background-color: var(--danger-color); }
    .btn-warning { background-color: #f59e0b; color: #000; }

    /* Inputs y Formularios */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: inherit;
    }

    textarea { resize: vertical; min-height: 70px; }

    /* Bandeja de Mensajes */
    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
    }

    .message-item {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    .message-body { font-size: 0.9rem; }

    /* Ocultar secciones según el modo */
    .advanced-only { display: none; }

    body.mode-advanced .advanced-only { display: flex; }
  </style>
</head>
<body class="mode-easy">

  <header>
    <div class="header-title">
      <span>🎛️</span>
      <h1>Panel de Administración TV</h1>
    </div>

    <!-- Conmutador de Interfaz Modo Fácil / Avanzado -->
    <div class="mode-switch">
      <button id="btnModeEasy" class="mode-btn active">⚡ Modo Fácil</button>
      <button id="btnModeAdvanced" class="mode-btn">🛠️ Modo Avanzado</button>
    </div>
  </header>

  <main>
    <!-- BLOQUE DE INTERACCIÓN RÁPIDA (MODO FÁCIL Y AVANZADO) -->
    <div class="grid-container">
      
      <!-- Monitor de Interacción -->
      <div class="card">
        <h2>📊 Interacción en Vivo</h2>
        <div class="counters-grid">
          <div class="counter-box">
            <div id="countAmen" class="counter-value">0</div>
            <div class="counter-label">🙌 Amén Recibidos</div>
          </div>
          <div class="counter-box">
            <div id="countJets" class="counter-value">0</div>
            <div class="counter-label">✈️ Jets Lanzados</div>
          </div>
        </div>

        <div class="btn-group">
          <button id="triggerConfetti" class="admin-btn btn-primary">🎉 Tirar Confetti</button>
          <button id="triggerJets" class="admin-btn btn-success">✈️ Lanzar Jets</button>
        </div>
      </div>

      <!-- Bandeja de Mensajes -->
      <div class="card">
        <h2>💬 Peticiones y Saludos en Vivo</h2>
        <div id="messagesContainer" class="messages-list">
          <div class="message-item">
            <div class="message-header">
              <strong>Hermana María</strong>
              <span>10:42 AM</span>
            </div>
            <div class="message-body">Saludos desde Tegucigalpa, pido oración por mi familia.</div>
          </div>
        </div>

        <!-- Mantenimiento de Mensajes (Solo Avanzado) -->
        <div class="advanced-only">
          <button id="btnClearMessages" class="admin-btn btn-danger" style="width: 100%;">
            🧹 Limpiar Historial de Mensajes
          </button>
        </div>
      </div>

    </div>

    <!-- BLOQUE AVANZADO (SOLO SE MUESTRA EN MODO AVANZADO) -->
    <div class="grid-container advanced-only">

      <!-- Gestión de Transmisión Especial (Embeds) -->
      <div class="card">
        <h2>📺 Transmisión Especial (YouTube / FB)</h2>
        <div class="form-group">
          <label>Código Embed o Iframe de la Transmisión:</label>
          <textarea id="embedInput" placeholder='<iframe src="https://www.youtube.com/embed/..."></iframe'></textarea>
        </div>
        <div class="btn-group">
          <button id="btnStartLive" class="admin-btn btn-success">🔴 Activar En Vivo</button>
          <button id="btnStopLive" class="admin-btn btn-danger">⏹️ Volver a Radio Alabanzas</button>
        </div>
      </div>

      <!-- Emisor de Avisos en Pantalla -->
      <div class="card">
        <h2>📢 Enviar Aviso / Marquesina</h2>
        <div class="form-group">
          <label>Mensaje Emergente en Vivo:</label>
          <input type="text" id="alertInput" placeholder="Ej: ¡Aviso! Mañana ayuno congregacional a las 8 AM">
        </div>
        <div class="btn-group">
          <button id="btnSendAlert" class="admin-btn btn-warning">📢 Publicar Aviso</button>
          <button id="btnClearAlert" class="admin-btn btn-danger">❌ Quitar Aviso</button>
        </div>

        <div style="margin-top: 10px;">
          <button id="btnResetCounters" class="admin-btn btn-danger" style="width: 100%;">
            🔄 Reiniciar Contadores (Amén / Jets)
          </button>
        </div>
      </div>

    </div>
  </main>

  <script>
    // --- CONTROL DE MODO FÁCIL / AVANZADO ---
    const btnModeEasy = document.getElementById('btnModeEasy');
    const btnModeAdvanced = document.getElementById('btnModeAdvanced');

    btnModeEasy.addEventListener('click', () => {
      document.body.classList.remove('mode-advanced');
      document.body.classList.add('mode-easy');
      btnModeEasy.classList.add('active');
      btnModeAdvanced.classList.remove('active');
    });

    btnModeAdvanced.addEventListener('click', () => {
      document.body.classList.remove('mode-easy');
      document.body.classList.add('mode-advanced');
      btnModeAdvanced.classList.add('active');
      btnModeEasy.classList.remove('active');
    });

    // --- LÓGICA TEMPORAL DE PRUEBAS (SIN FIREBASE AÚN) ---
    document.getElementById('triggerConfetti').addEventListener('click', () => {
      alert('🎉 Comando de Confetti enviado a los espectadores.');
    });

    document.getElementById('triggerJets').addEventListener('click', () => {
      alert('✈️ Lluvia de Jets enviada a los espectadores.');
    });

    document.getElementById('btnClearMessages').addEventListener('click', () => {
      if (confirm('¿Seguro que deseas vaciar la bandeja de mensajes?')) {
        document.getElementById('messagesContainer').innerHTML = '<p style="font-size:0.85rem; opacity:0.6; text-align:center;">No hay mensajes registrados.</p>';
      }
    });

    document.getElementById('btnResetCounters').addEventListener('click', () => {
      if (confirm('¿Deseas reiniciar los contadores de Amén y Jets a cero?')) {
        document.getElementById('countAmen').innerText = '0';
        document.getElementById('countJets').innerText = '0';
      }
    });
  </script>
</body>
</html>
